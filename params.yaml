# Model Hyperparameters
data:
  train_test_split: 0.8
  random_state: 42
  
xgboost:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 300
  
lightgbm:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  num_leaves: 31
  scale_pos_weight: 300
  
catboost:
  iterations: 200
  depth: 6
  learning_rate: 0.05
  scale_pos_weight: 300
  
random_forest:
  n_estimators: 200
  max_depth: 15
  
smote:
  random_state: 42
  k_neighbors: 5
  
feature_selection:
  n_features: 20
  
threshold:
  fraud_probability: 0.5
